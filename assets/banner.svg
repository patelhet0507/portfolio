<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #08090c; }
      .grid { stroke: rgba(255, 255, 255, 0.05); stroke-width: 1; }
      .title { font-family: 'Syne', 'Helvetica Neue', sans-serif; font-size: 56px; font-weight: 800; fill: #f3f4f6; letter-spacing: -2px; }
      .sub { font-family: 'JetBrains Mono', monospace; font-size: 18px; fill: #9ca3af; letter-spacing: 1px; }
      .tag { font-family: 'JetBrains Mono', monospace; font-size: 13px; fill: #10b981; text-transform: uppercase; letter-spacing: 2px; }
      .border { stroke: rgba(255, 255, 255, 0.1); stroke-width: 1; fill: none; }
      .accent-line { stroke: #10b981; stroke-width: 2; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" class="bg" />

  <!-- Technical Grid Pattern -->
  <line x1="0" y1="80" x2="1200" y2="80" class="grid" />
  <line x1="0" y1="160" x2="1200" y2="160" class="grid" />
  <line x1="0" y1="240" x2="1200" y2="240" class="grid" />
  <line x1="240" y1="0" x2="240" y2="320" class="grid" />
  <line x1="480" y1="0" x2="480" y2="320" class="grid" />
  <line x1="720" y1="0" x2="720" y2="320" class="grid" />
  <line x1="960" y1="0" x2="960" y2="320" class="grid" />

  <!-- Border Box -->
  <rect x="24" y="24" width="1152" height="272" rx="8" class="border" />

  <!-- Accent Top Line -->
  <line x1="24" y1="24" x2="240" y2="24" class="accent-line" />

  <!-- Text Elements -->
  <text x="64" y="80" class="tag">System Identity // 2026</text>
  <text x="64" y="155" class="title">HET PATEL</text>
  <text x="64" y="205" class="sub">Full-Stack Developer · Cloud Computing · Systems · AI</text>

  <!-- Telemetry Badge right -->
  <text x="820" y="80" class="tag">Adani University</text>
  <text x="820" y="125" font-family="'JetBrains Mono', monospace" font-size="14" fill="#6b7280">Integrated B.Tech (CS &amp; AM)</text>
  <text x="820" y="150" font-family="'JetBrains Mono', monospace" font-size="14" fill="#6b7280">+ M.Tech (Cloud Computing)</text>

  <!-- Status Dot -->
  <circle cx="828" cy="200" r="4" fill="#10b981" />
  <text x="844" y="204" font-family="'JetBrains Mono', monospace" font-size="13" fill="#10b981">Available for Opportunities</text>
</svg>
